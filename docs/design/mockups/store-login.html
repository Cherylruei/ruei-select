<!doctype html>
<html lang="zh-Hant" data-variant="candy">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>芮選 · 小美的選物店 · 登入</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/styles/design-tokens.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="_tailwind-config.js"></script>
  <style>
    body { font-family: var(--font-body); }
    [data-variant="candy"] {
      --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 22px; --r-2xl: 28px;
      --line-warm:        #F0D9CB;
      --line-warm-strong: #E6C7B4;
      --line-warm-soft:   #F7E5D8;
    }
    .card-line  { border: 1px solid var(--line-warm); }
    .placeholder-img { background: repeating-linear-gradient(135deg, #FFE9E0, #FFE9E0 8px, #FFD9E4 8px, #FFD9E4 16px); }

    .phone {
      width: 100%; max-width: 420px; margin: 0 auto;
      min-height: 100vh; background: var(--bg-app);
      position: relative; box-shadow: 0 0 80px rgba(255, 110, 148, 0.12);
      display: flex; flex-direction: column;
    }
    @media (min-width: 768px) {
      .phone { margin: 24px auto; min-height: calc(100vh - 48px); border-radius: var(--r-2xl); overflow: hidden; }
    }
    .desktop-hint {
      display: none; position: fixed; left: 24px; top: 24px;
      font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle);
      letter-spacing: 0.15em; text-transform: uppercase;
    }
    @media (min-width: 1024px) { .desktop-hint { display: block; } }
    .logo-body { fill: #FFD9E4; } .logo-eye { fill: #3B2A2A; }
    .logo-blush { fill: #FF6E94; opacity: 0.7; } .logo-sparkle { fill: #FFB347; }

    .sparkle { position: absolute; pointer-events: none; color: var(--c-accent); animation: twinkle 2s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.2); opacity: 1; } }

    .line-btn { background: #06C755; box-shadow: 0 10px 26px rgba(6,199,85,0.32); }
    .line-btn:hover { background: #05B14C; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .floaty { animation: floaty 4s ease-in-out infinite; }
  </style>
</head>
<body style="background: linear-gradient(160deg, #FFF6F1 0%, #FCEAE0 55%, #F6DCD0 100%);">

  <span class="desktop-hint">MOBILE · 390 PX · /STORE/[SLUG]/LOGIN · LINE LIFF</span>

  <div class="phone">

    <!-- ===== Hero gradient ===== -->
    <section class="relative px-6 pt-14 pb-12 overflow-hidden" style="background: linear-gradient(150deg, #FF6E94 0%, #9A8CFF 100%);">
      <span class="sparkle" style="top:42px;right:46px;font-size:18px;">✦</span>
      <span class="sparkle" style="top:120px;left:30px;font-size:13px;animation-delay:.8s;">✦</span>
      <span class="sparkle" style="bottom:34px;right:64px;font-size:15px;animation-delay:1.3s;">✦</span>
      <div class="absolute -right-10 -top-10 w-40 h-40 rounded-pill bg-white/12"></div>
      <div class="absolute -left-8 bottom-4 w-24 h-24 rounded-pill bg-white/10"></div>

      <div class="relative z-10 flex flex-col items-center text-center">
        <div class="floaty w-24 h-24 rounded-2xl bg-white/95 flex items-center justify-center shadow-lg" style="box-shadow:0 18px 40px -10px rgba(60,40,40,0.35);">
          <svg width="64" height="64" viewBox="0 0 44 44">
            <rect class="logo-sparkle" x="35" y="6" width="6" height="6" transform="rotate(45 38 9)" rx="1" />
            <rect class="logo-sparkle" x="4" y="32" width="4" height="4" transform="rotate(45 6 34)" rx="0.8" />
            <rect class="logo-body" x="6" y="10" width="32" height="28" rx="14" />
            <circle class="logo-blush" cx="13" cy="27" r="2.5"/>
            <circle class="logo-blush" cx="31" cy="27" r="2.5"/>
            <ellipse class="logo-eye" cx="17" cy="22" rx="1.6" ry="2.4"/>
            <ellipse class="logo-eye" cx="27" cy="22" rx="1.6" ry="2.4"/>
            <ellipse class="logo-blush" cx="22" cy="29" rx="3" ry="1.4"/>
          </svg>
        </div>
        <div class="inline-flex items-center gap-1.5 font-mono text-[10px] text-white tracking-[0.2em] uppercase px-2.5 py-1 mt-5 rounded-pill bg-white/15" style="border:1px solid rgba(255,255,255,0.28);">
          邀請你加入
        </div>
        <h1 class="font-display font-bold text-white text-2xl mt-2.5 leading-tight">小美的選物店</h1>
        <p class="text-white/85 text-xs mt-1.5 font-mono tracking-wide">RUEI · SELECT</p>
      </div>
    </section>

    <!-- ===== Body ===== -->
    <section class="flex-1 px-6 pt-7 pb-8 flex flex-col">

      <div class="text-center">
        <h2 class="font-display font-bold text-xl leading-snug">日本・英國・台灣<br/>職人小物，幫你跨海代購</h2>
        <p class="text-sm text-fg-muted mt-3 leading-relaxed">用 LINE 一秒登入，加入小美的選物清單。<br/>登入後填寫資料，待小美核准即可逛賣場 ✿</p>
      </div>

      <!-- selling points -->
      <div class="grid grid-cols-3 gap-2 mt-7">
        <div class="rounded-xl bg-surface card-line p-3 flex flex-col items-center text-center gap-1.5">
          <div class="w-9 h-9 rounded-pill flex items-center justify-center" style="background:#FFD9E4;color:#E8527C;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
          </div>
          <span class="font-display font-bold text-[11px] leading-tight">精選好物</span>
        </div>
        <div class="rounded-xl bg-surface card-line p-3 flex flex-col items-center text-center gap-1.5">
          <div class="w-9 h-9 rounded-pill flex items-center justify-center" style="background:#ECE7FF;color:#7E70E8;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 4l2.5 5 5.5.8-4 4 1 5.5L12 16.8 7 19.3l1-5.5-4-4 5.5-.8L12 4z"/></svg>
          </div>
          <span class="font-display font-bold text-[11px] leading-tight">許願代購</span>
        </div>
        <div class="rounded-xl bg-surface card-line p-3 flex flex-col items-center text-center gap-1.5">
          <div class="w-9 h-9 rounded-pill flex items-center justify-center" style="background:#FFEAD0;color:#C97A1E;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg>
          </div>
          <span class="font-display font-bold text-[11px] leading-tight">訂單追蹤</span>
        </div>
      </div>

      <div class="flex-1"></div>

      <!-- LINE login CTA -->
      <div class="mt-8">
        <a href="store-register.html" class="line-btn w-full h-14 rounded-pill text-white font-display font-bold text-md flex items-center justify-center gap-2.5 active:scale-[.98] transition">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.9 3 2.75 6.43 2.75 10.66c0 3.79 3.3 6.96 7.76 7.56.3.06.71.2.81.46.09.24.06.6.03.85l-.13.79c-.04.24-.18.92.81.5s5.34-3.14 7.29-5.38h0c1.34-1.47 1.99-2.97 1.99-4.78C21.31 6.43 17.13 3 12 3z"/></svg>
          用 LINE 快速登入
        </a>
        <div class="flex items-center justify-center gap-1.5 mt-3.5 text-fg-subtle">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
          <span class="font-mono text-[10px] tracking-wide">透過 LINE 安全登入 · 不會公開你的帳號</span>
        </div>
      </div>

      <p class="text-center text-[11px] text-fg-subtle mt-6 leading-relaxed">
        登入即表示同意小美的選物店<a class="text-primary font-semibold" href="#">服務條款</a>與<a class="text-primary font-semibold" href="#">隱私權政策</a>
      </p>
    </section>
  </div>
</body>
</html>
