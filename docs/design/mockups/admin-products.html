    body { font-family: var(--font-body); }

    /* product thumbnail placeholders — low-chroma warm tints */
    .ph { background: repeating-linear-gradient(135deg, var(--ink-100), var(--ink-100) 7px, var(--ink-50) 7px, var(--ink-50) 14px); }
    .ph-a { background: repeating-linear-gradient(135deg, var(--sakura-100), var(--sakura-100) 7px, var(--sakura-50) 7px, var(--sakura-50) 14px); }
    .ph-b { background: repeating-linear-gradient(135deg, var(--forest-100), var(--forest-100) 7px, var(--forest-50) 7px, var(--forest-50) 14px); }
    .ph-c { background: repeating-linear-gradient(135deg, var(--earth-100), var(--earth-100) 7px, var(--earth-50) 7px, var(--earth-50) 14px); }

    /* switch (上/下架) */
    .sw { position: relative; display: inline-block; width: 40px; height: 24px; cursor: pointer; flex-shrink: 0; }
    .sw input { display: none; }
    .sw .track { position: absolute; inset: 0; background: var(--ink-300); border-radius: 999px; transition: background .2s var(--ease-out); }
    .sw .thumb { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 999px; background: #fff; box-shadow: var(--shadow-sm); transition: transform .2s var(--ease-spring); }
    .sw input:checked ~ .track { background: var(--c-success); }
    .sw input:checked ~ .thumb { transform: translateX(16px); }
    .sw.is-disabled { opacity: .5; pointer-events: none; }

    .scrim { transition: opacity .28s var(--ease-out); }
    .modal-box { transition: transform .28s var(--ease-spring), opacity .2s var(--ease-out); }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

    .row-off { opacity: .58; }
    .menu { box-shadow: var(--shadow-lg); }
  </style>

      { id:'p2', sup:'v1', name:'櫻花粉保溫瓶 500ml', cat:'生活', spec:'櫻花粉 / 霧灰', ph:'ph-c',
        price:1980, cost:1280, costForeign:'¥5,900', views:312, status:'live' },
      { id:'p3', sup:'v1', name:'日系亞麻襯衫外套', cat:'女裝', spec:'燕麥 / 墨綠・M–XL', ph:'ph-b',
        price:1680, cost:1050, costForeign:'¥4,850', views:96, status:'off' },

      { id:'p4', sup:'v2', name:'純棉寬版 T 恤', cat:'女裝', spec:'白 / 黑 / 杏・F', ph:'ph',
        price:390, cost:180, costForeign:null, views:520, status:'live' },
      { id:'p5', sup:'v2', name:'兒童棉質防曬外套', cat:'童裝', spec:'粉 / 藍・100–140', ph:'ph-a',
        price:580, cost:300, costForeign:null, views:188, status:'live' },
      { id:'p6', sup:'v2', name:'韓系帆布托特包', cat:'配件', spec:'米 / 黑', ph:'ph-b',
        price:450, cost:220, costForeign:null, views:264, status:'live' },
      { id:'p7', sup:'v2', name:'毛呢貝雷帽', cat:'配件', spec:'駝 / 酒紅 / 黑', ph:'ph-c',
        price:340, cost:150, costForeign:null, views:74, status:'oos' },

      { id:'p8', sup:'v3', name:'英國有機蜂蜜檸檬茶', cat:'食品', spec:'盒裝 20 入', ph:'ph-c',
        price:680, cost:430, costForeign:'$13.5', views:402, status:'live' },
      { id:'p9', sup:'v3', name:'英倫風骨瓷馬克杯', cat:'生活', spec:'玫瑰 / 薄荷', ph:'ph-b',
        price:890, cost:560, costForeign:'$17.8', views:156, status:'live' },
      { id:'p10', sup:'v3', name:'手工薰衣草香氛蠟燭', cat:'生活', spec:'200g', ph:'ph-a',
        price:760, cost:480, costForeign:'$15.2', views:88, status:'off' },

      { id:'p11', sup:'v4', name:'港版保濕精華 30ml', cat:'美妝', spec:'單瓶 / 雙瓶組', ph:'ph-a',
        price:1280, cost:760, costForeign:'HK$148', views:230, status:'live' },
      { id:'p12', sup:'v4', name:'香港鉅記杏仁餅', cat:'食品', spec:'袋裝 12 入', ph:'ph-c',
        price:420, cost:240, costForeign:'HK$48', views:174, status:'live' },

      { id:'p13', sup:'v5', name:'日本季節限定軟糖組', cat:'食品', spec:'綜合 8 包', ph:'ph-a',
        price:560, cost:330, costForeign:'¥1,520', views:198, status:'live' },
      { id:'p14', sup:'v5', name:'抹茶夾心餅乾禮盒', cat:'食品', spec:'禮盒 16 入', ph:'ph-b',
        price:780, cost:480, costForeign:'¥2,200', views:142, status:'live' },
    ];

    // ============================================================
    //  State + helpers
    // ============================================================
    const STATE = { status:'all', sup:'all', cat:'all', q:'' };
    const collapsed = new Set();

    function margin(p){ return p.price>0 ? Math.round((p.price-p.cost)/p.price*100) : 0; }
    function marginColor(m){ return m>=45 ? 'text-success' : m>=30 ? 'text-fg' : 'text-warning'; }

    function statusBadge(s){
      if (s==='live') return '<span class="inline-flex items-center gap-1 h-6 px-2.5 rounded-pill bg-success-bg text-success font-display font-semibold text-xs"><span class="w-1.5 h-1.5 rounded-pill bg-current"></span>上架中</span>';
      if (s==='oos')  return '<span class="inline-flex items-center gap-1 h-6 px-2.5 rounded-pill bg-danger-bg text-danger font-display font-semibold text-xs"><span class="w-1.5 h-1.5 rounded-pill bg-current"></span>缺貨</span>';
      return '<span class="inline-flex items-center gap-1 h-6 px-2.5 rounded-pill bg-sunken text-fg-muted font-display font-semibold text-xs">已下架</span>';
    }

    function matches(p){
      if (STATE.status!=='all' && p.status!==STATE.status) return false;
      if (STATE.sup!=='all' && p.sup!==STATE.sup) return false;
      if (STATE.cat!=='all' && p.cat!==STATE.cat) return false;
      if (STATE.q){
        const q = STATE.q.toLowerCase();
        if (!(p.name.toLowerCase().includes(q) || p.cat.includes(q) || p.spec.toLowerCase().includes(q))) return false;
      }
      return true;
    }

    // ============================================================
    //  Render
    // ============================================================
    function rowHTML(p){
      const v = VENDORS.find(x=>x.id===p.sup);
      const m = margin(p);
      const off = p.status!=='live';
      const checked = p.status==='live' ? 'checked' : '';
      const swDisabled = p.status==='oos' ? 'is-disabled' : '';
      return `
      <tr class="border-t border-line hover:bg-ink-50 ${off?'row-off':''}" data-pid="${p.id}">
        <td class="pl-5 pr-3 py-3">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-md ${p.ph} border border-line shrink-0"></div>
            <div class="min-w-0">
              <div class="font-semibold truncate max-w-[260px]">${p.name}</div>
              <div class="font-mono text-[10px] text-fg-subtle mt-0.5">${p.spec}</div>
            </div>
          </div>
        </td>
        <td class="px-3 py-3">
          <span class="inline-flex items-center h-5 px-2 rounded-pill bg-sunken text-fg-muted font-display font-semibold text-[10px]">${p.cat}</span>
        </td>
        <td class="px-3 py-3 text-right">
          <div class="font-mono font-semibold" style="color:var(--c-primary-hv)">NT$ ${p.price.toLocaleString()}</div>
        </td>
        <td class="px-3 py-3 text-right">
          <div class="font-mono text-xs text-fg-muted">NT$ ${p.cost.toLocaleString()}</div>
          ${p.costForeign?`<div class="font-mono text-[10px] text-fg-subtle">${p.costForeign}</div>`:''}
        </td>
        <td class="px-3 py-3 text-right">
          <span class="font-mono font-semibold text-sm ${marginColor(m)}">${m}%</span>
        </td>
        <td class="px-3 py-3 text-right">
          <span class="font-mono text-xs text-fg-muted">${p.views}</span>
        </td>
        <td class="px-3 py-3">${statusBadge(p.status)}</td>
        <td class="px-3 py-3">
          <label class="sw ${swDisabled}" title="${p.status==='oos'?'缺貨中，補貨後可上架':'上架 / 下架'}">
            <input type="checkbox" ${checked} onchange="toggleStatus('${p.id}', this.checked)" />
            <span class="track"></span><span class="thumb"></span>
          </label>
        </td>
        <td class="pr-4 pl-1 py-3 text-right">
          <button onclick="openKebab(event,'${p.id}')" class="w-8 h-8 rounded-pill hover:bg-sunken flex items-center justify-center text-fg-subtle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
          </button>
        </td>
      </tr>`;
    }

    function groupHTML(v, prods){
      const isCol = collapsed.has(v.id);
      const liveN = prods.filter(p=>p.status==='live').length;
      return `
      <div class="bg-surface border border-line rounded-xl overflow-hidden">
        <div class="flex items-center gap-3 px-5 py-3.5 ${isCol?'':'border-b border-line'} bg-ink-50 cursor-pointer hover:bg-ink-100 transition" onclick="toggleGroup('${v.id}')">
          <div class="w-9 h-9 rounded-md flex items-center justify-center text-white font-display font-bold shrink-0" style="background:${v.shade}">${v.avatar}</div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-display font-bold text-md">${v.name}</span>
              <span class="inline-flex items-center h-5 px-2 rounded-pill bg-earth-100 text-earth-700 font-display font-semibold text-[10px]">${v.tag}</span>
            </div>
            <div class="font-mono text-[10px] text-fg-subtle mt-0.5">${prods.length} 件商品 · ${liveN} 上架中 · 預設 ${CUR_SYM[v.currency]} ${v.currency}</div>
          </div>
          <div class="flex-1"></div>
          <a href="admin-products-new.html" onclick="event.stopPropagation()" class="hidden sm:inline-flex items-center gap-1.5 h-8 px-3 rounded-pill border border-line text-fg-muted font-display font-semibold text-xs hover:bg-surface transition">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新增到此廠商
          </a>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" class="text-fg-subtle transition-transform ${isCol?'':'rotate-180'}"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        ${isCol ? '' : `
        <table class="w-full">
          <thead>
            <tr class="bg-surface">
              <th class="text-left pl-5 pr-3 py-2.5 font-display font-bold text-[10px] uppercase tracking-wider text-fg-muted">商品</th>
              <th class="text-left px-3 py-2.5 font-display font-bold text-[10px] uppercase tracking-wider text-fg-muted">類別</th>
              <th class="text-right px-3 py-2.5 font-display font-bold text-[10px] uppercase tracking-wider text-fg-muted">售價</th>
              <th class="text-right px-3 py-2.5 font-display font-bold text-[10px] uppercase tracking-wider text-fg-muted">成本</th>
              <th class="text-right px-3 py-2.5 font-display font-bold text-[10px] uppercase tracking-wider text-fg-muted">毛利</th>
              <th class="text-right px-3 py-2.5 font-display font-bold text-[10px] uppercase tracking-wider text-fg-muted">瀏覽</th>
              <th class="text-left px-3 py-2.5 font-display font-bold text-[10px] uppercase tracking-wider text-fg-muted">狀態</th>
              <th class="text-left px-3 py-2.5 font-display font-bold text-[10px] uppercase tracking-wider text-fg-muted">上架</th>
              <th class="w-10"></th>
            </tr>
          </thead>
          <tbody class="text-sm">${prods.map(rowHTML).join('')}</tbody>
        </table>`}
      </div>`;
    }

    function render(){
      const root = document.getElementById('groups');
      let html = '';
      let any = false;
      for (const v of VENDORS){
        if (STATE.sup!=='all' && STATE.sup!==v.id) continue;
        const prods = PRODUCTS.filter(p=>p.sup===v.id && matches(p));
        if (prods.length===0) continue;
        any = true;
        html += groupHTML(v, prods);
      }
      root.innerHTML = html;
      document.getElementById('emptyState').classList.toggle('hidden', any);
    }

    // ============================================================
    //  Filters
    // ============================================================
    function setStatus(s){
      STATE.status = s;
      document.querySelectorAll('.st-tab').forEach(b=>{
        const active = b.dataset.st===s;
        if (active){
          b.classList.add('bg-primary','text-white');
          b.classList.remove('bg-success-bg','text-success','bg-sunken','text-fg-muted','bg-danger-bg','text-danger');
        } else {
          b.classList.remove('bg-primary','text-white');
          const map = { all:['bg-primary','text-white'], live:['bg-success-bg','text-success'], off:['bg-sunken','text-fg-muted'], oos:['bg-danger-bg','text-danger'] };
          b.classList.add(...map[b.dataset.st]);
        }
      });
      render();
    }
    function setCat(c){
      STATE.cat = c;
      document.querySelectorAll('.cat-pill').forEach(b=>{
        const active = b.dataset.cat===c;
        b.classList.toggle('bg-secondary', active);
        b.classList.toggle('text-white', active);
        b.classList.toggle('border', !active);
        b.classList.toggle('border-line', !active);
        b.classList.toggle('text-fg-muted', !active);
      });
      render();
    }
    function setSupplier(id){
      STATE.sup = id;
      const note = document.getElementById('supFilterNote');
      if (id==='all'){ note.classList.add('hidden'); }
      else {
        const v = VENDORS.find(x=>x.id===id);
        if (v){ note.querySelector('#supFilterName').textContent = v.name; note.classList.remove('hidden'); }
      }
      render();
    }
    function setSearch(v){ STATE.q = v.trim(); render(); }

    function toggleGroup(id){
      if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
      render();
    }

    function toggleStatus(pid, on){
      const p = PRODUCTS.find(x=>x.id===pid);
      if (!p) return;
      p.status = on ? 'live' : 'off';
      render();
      showToast(on ? `「${p.name}」已上架` : `「${p.name}」已下架`);
    }

    // ============================================================
    //  Kebab menu
    // ============================================================
    let menuPid = null;
    function openKebab(e, pid){
      e.stopPropagation();
      menuPid = pid;
      const menu = document.getElementById('kebab');
      menu.classList.remove('hidden');
      const r = e.currentTarget.getBoundingClientRect();
      let left = r.right - menu.offsetWidth;
      let top = r.bottom + 6;
      if (top + menu.offsetHeight > window.innerHeight - 10) top = r.top - menu.offsetHeight - 6;
      menu.style.left = Math.max(10,left) + 'px';
      menu.style.top = top + 'px';
    }
    function closeKebab(){ document.getElementById('kebab').classList.add('hidden'); }
    document.addEventListener('click', e=>{
      const menu = document.getElementById('kebab');
      if (!menu.classList.contains('hidden') && !menu.contains(e.target)) closeKebab();
    });
    function copyLink(){ closeKebab(); showToast('已複製商品連結到剪貼簿'); }
    function dupProduct(){ closeKebab(); showToast('已複製為新商品草稿'); }

    // ============================================================
    //  Delete modal
    // ============================================================
    let deletingId = null;
    function askDeleteFromMenu(){ const id = menuPid; closeKebab(); askDelete(id); }
    function askDelete(id){
      deletingId = id;
      const p = PRODUCTS.find(x=>x.id===id);
      document.getElementById('delName').textContent = p ? p.name : '';
      const wrap = document.getElementById('modalWrap');
      wrap.classList.remove('hidden'); wrap.classList.add('flex');
      requestAnimationFrame(()=>{
        document.getElementById('modalScrim').style.opacity='1';
        document.getElementById('modalBox').classList.remove('opacity-0','scale-95');
      });
    }
    function closeModal(){
      document.getElementById('modalScrim').style.opacity='0';
      document.getElementById('modalBox').classList.add('opacity-0','scale-95');
      setTimeout(()=>{ const w=document.getElementById('modalWrap'); w.classList.add('hidden'); w.classList.remove('flex'); }, 220);
    }
    function doDelete(){
      const i = PRODUCTS.findIndex(x=>x.id===deletingId);
      const name = i>=0 ? PRODUCTS[i].name : '';
      if (i>=0) PRODUCTS.splice(i,1);
      closeModal();
      render();
      showToast('已刪除「' + name + '」');
    }

    // ============================================================
    //  Toast
    // ============================================================
    let toastTimer = null;
    function showToast(msg){
      document.getElementById('toastMsg').textContent = msg;
      const t = document.getElementById('toast');
      t.style.opacity='1'; t.style.transform='translate(-50%, 0)';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translate(-50%, 8px)'; }, 2400);
    }

    document.addEventListener('keydown', e=>{
      if (e.key==='Escape'){
        if (!document.getElementById('modalWrap').classList.contains('hidden')) closeModal();
        else closeKebab();
      }
    });

    // ============================================================
    //  Init
    // ============================================================
    (function init(){
      const sel = document.getElementById('supFilter');
      VENDORS.forEach(v=>{
        const o = document.createElement('option');
        o.value = v.id; o.textContent = v.name;
        sel.appendChild(o);
      });
      // 從供應商頁「查看商品」帶入的 ?supplier=<id> 預先套用廠商篩選
      const sup = new URLSearchParams(location.search).get('supplier');
      if (sup && VENDORS.some(v=>v.id===sup)){
        STATE.sup = sup;
        sel.value = sup;
        const v = VENDORS.find(x=>x.id===sup);
        const note = document.getElementById('supFilterNote');
        if (note){
          note.querySelector('#supFilterName').textContent = v.name;
          note.classList.remove('hidden');
        }
      }
      render();
    })();

    function clearSupplierFilter(){
      STATE.sup = 'all';
      document.getElementById('supFilter').value = 'all';
      document.getElementById('supFilterNote').classList.add('hidden');
      render();
    }
  </script>
</body>
</html>
