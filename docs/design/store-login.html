<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>芮選小舖 · 申請加入賣場</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }

      :root {
        --sage-50:#f2f8ec; --sage-100:#e0f0d0; --sage-200:#b8dca0;
        --sage-400:#6dab3d; --sage-500:#508a2c; --sage-600:#3d7020;
        --sage-700:#2c5218; --sage-800:#1c3610;
        --sakura-pale:#fff0f5; --sakura-100:#ffd8e8;
        --sakura-mid:#f5a8bf; --sakura:#e8749d;
        --neutral-0:#fff; --neutral-50:#f6fbf0; --neutral-100:#edf5e8;
        --neutral-200:#d8e8cc; --neutral-300:#b4c8a0; --neutral-400:#8a9a82;
        --neutral-500:#647258; --neutral-600:#4a5e42; --neutral-700:#2a3e20; --neutral-800:#192e10;
        --line-green:#00b900;
        --r-sm:6px; --r-md:12px; --r-lg:18px; --r-xl:24px; --r-full:999px;
        --ease-smooth:cubic-bezier(.4,0,.2,1); --ease-bounce:cubic-bezier(.34,1.56,.64,1);
      }

      body {
        display: flex;
        min-height: 100vh;
        font-family: 'Noto Sans TC', sans-serif;
        background: #fcfff9;
      }

      /* ── LEFT PANEL ─────────────────────────────── */
      .brand {
        width: 46%;
        background: var(--sage-600);
        background-image:
          radial-gradient(ellipse 60% 50% at 85% 12%, rgba(109,171,61,.4) 0%, transparent 65%),
          radial-gradient(ellipse 50% 60% at 10% 88%, rgba(28,54,16,.52) 0%, transparent 60%);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 56px 48px;
        min-height: 100vh;
      }

      .bg-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,.07);
        pointer-events: none;
      }
      .ring-1 { width: 320px; height: 320px; top: -80px; left: 50%; transform: translateX(-50%); }
      .ring-2 { width: 220px; height: 220px; top: -30px; left: 50%; transform: translateX(-50%); border-color: rgba(255,255,255,.05); }
      .ring-3 { width: 480px; height: 480px; top: -180px; left: 50%; transform: translateX(-50%); border-color: rgba(255,255,255,.04); }
      .ring-4 { width: 260px; height: 260px; bottom: -80px; right: -60px; border-color: rgba(232,116,157,.1); }
      .ring-5 { width: 180px; height: 180px; bottom: -40px; right: -20px; border-color: rgba(232,116,157,.08); }

      .deco-leaf { position: absolute; pointer-events: none; }
      .dl-l1 { bottom: 25%; left: 8%; width: 50px; opacity: .1; transform: rotate(55deg); }
      .dl-l2 { bottom: 14%; right: 10%; width: 62px; opacity: .09; transform: rotate(-20deg); }
      .dl-l3 { top: 55%; right: 5%; width: 38px; opacity: .08; transform: rotate(30deg); }

      .brand-inner {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        text-align: center;
      }

      /* Store avatar */
      .store-avatar-wrap {
        position: relative;
        margin-bottom: 18px;
        animation: floatY 4s ease-in-out infinite;
      }
      @keyframes floatY {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .store-avatar {
        width: 80px; height: 80px;
        border-radius: 50%;
        background: rgba(255,255,255,.95);
        color: var(--sage-700);
        display: grid;
        place-items: center;
        font-family: 'Zen Maru Gothic', sans-serif;
        font-size: 36px;
        font-weight: 700;
        box-shadow: 0 8px 24px rgba(0,0,0,.18), inset 0 0 0 4px rgba(245,168,191,.18);
      }
      .store-avatar-ring {
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 1px dashed rgba(255,255,255,.28);
      }
      .store-avatar-ring::before, .store-avatar-ring::after {
        content: '';
        position: absolute;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--sakura-mid);
      }
      .store-avatar-ring::before { top: -3px; left: 50%; transform: translateX(-50%); }
      .store-avatar-ring::after { bottom: -3px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.6); }

      .store-name {
        font-family: 'Zen Maru Gothic', sans-serif;
        font-size: 38px;
        font-weight: 700;
        color: #fff;
        letter-spacing: .12em;
        line-height: 1;
        margin-bottom: 6px;
      }
      .store-tag {
        font-size: 11.5px;
        color: rgba(255,255,255,.42);
        letter-spacing: .26em;
        text-transform: uppercase;
      }

      .ornament {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 26px 0 22px;
        width: 100%;
        max-width: 280px;
      }
      .ornament::before, .ornament::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(255,255,255,.18);
      }
      .ornament-center {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .orn-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(245,168,191,.7); }
      .orn-dot-sm { width: 3px; height: 3px; border-radius: 50%; background: rgba(245,168,191,.4); }

      .brand-hl {
        font-family: 'Zen Maru Gothic', sans-serif;
        font-size: 22px;
        font-weight: 500;
        color: #fff;
        line-height: 1.5;
        letter-spacing: .04em;
        margin-bottom: 22px;
      }
      .brand-hl .accent { color: var(--sakura-mid); }

      .features {
        list-style: none;
        width: 80%;
        max-width: 320px;
        text-align: left;
      }
      .feature {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 14px 0;
        border-top: 1px solid rgba(255,255,255,.08);
      }
      .feature:last-child { border-bottom: 1px solid rgba(255,255,255,.08); }
      .feature-icon-wrap {
        width: 28px; height: 28px;
        border-radius: 8px;
        background: rgba(255,255,255,.12);
        border: 1px solid rgba(255,255,255,.1);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .feature-icon-wrap svg {
        width: 13px; height: 13px;
        color: var(--sakura-mid);
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }
      .feature-label {
        font-size: 15px;
        color: rgba(255,255,255,.82);
      }

      .brand-foot {
        margin-top: auto;
        padding-top: 28px;
        font-size: 11.5px;
        color: rgba(255,255,255,.32);
        letter-spacing: .04em;
      }
      .brand-foot a { color: rgba(255,255,255,.55); text-decoration: none; }
      .brand-foot a:hover { color: #fff; }

      /* ── RIGHT PANEL ────────────────────────────── */
      .form-side {
        width: 54%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 72px;
        background: #fcfff9;
        position: relative;
      }
      .form-side::after {
        content: '';
        position: absolute;
        top: 0; right: 0;
        width: 220px; height: 220px;
        background: radial-gradient(circle at top right, rgba(184,216,153,.16) 0%, transparent 70%);
        pointer-events: none;
      }

      .form-top-link {
        position: absolute;
        top: 28px; right: 32px;
        font-size: 12.5px;
        color: var(--neutral-500);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 12px;
        border-radius: var(--r-full);
        border: 1px solid var(--neutral-200);
        background: rgba(255,255,255,.7);
        backdrop-filter: blur(6px);
        transition: background .2s var(--ease-smooth), color .2s var(--ease-smooth), border-color .2s var(--ease-smooth);
        z-index: 5;
      }
      .form-top-link:hover {
        color: var(--sage-700);
        border-color: var(--sage-200);
        background: var(--sage-50);
      }
      .form-top-link svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; }

      .form-box {
        width: 100%;
        max-width: 420px;
        position: relative;
        z-index: 1;
      }

      .form-eyebrow {
        font-size: 13px;
        font-weight: 500;
        color: var(--sage-500);
        letter-spacing: .14em;
        text-transform: uppercase;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .form-eyebrow::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--sage-100);
      }

      .form-title {
        font-family: 'Zen Maru Gothic', sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: var(--sage-700);
        line-height: 1.3;
        margin-bottom: 8px;
        letter-spacing: .04em;
      }
      .form-body {
        font-size: 14px;
        color: var(--neutral-500);
        line-height: 1.75;
        margin-bottom: 22px;
      }

      /* LINE button */
      .btn-line {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        padding: 15px 24px;
        background: var(--line-green);
        color: #fff;
        border: none;
        border-radius: var(--r-full);
        font-size: 15px;
        font-weight: 700;
        font-family: 'Noto Sans TC', sans-serif;
        cursor: pointer;
        text-decoration: none;
        letter-spacing: .05em;
        transition: background .2s, box-shadow .2s, transform .2s;
        box-shadow: 0 6px 20px rgba(0,185,0,.22);
        position: relative;
        overflow: hidden;
      }
      .btn-line::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,.14) 0%, transparent 50%);
      }
      .btn-line:hover {
        background: #00a800;
        box-shadow: 0 8px 26px rgba(0,185,0,.32);
        transform: translateY(-2px);
      }
      .line-logo {
        width: 22px; height: 22px;
        flex-shrink: 0;
      }

      /* Divider */
      .or-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 22px 0;
      }
      .or-divider::before, .or-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--neutral-200);
      }
      .or-divider span {
        font-size: 11.5px;
        color: var(--neutral-400);
        letter-spacing: .12em;
      }

      /* Form */
      .form-row { margin-bottom: 14px; }
      .form-label {
        display: block;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--neutral-700);
        margin-bottom: 6px;
        letter-spacing: .03em;
      }
      .form-label .req { color: var(--sakura); margin-left: 2px; }
      .form-label .hint { color: var(--neutral-400); font-weight: 400; font-size: 11px; margin-left: 4px; }
      .input-wrap {
        position: relative;
      }
      .input-wrap svg.input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 14px; height: 14px;
        stroke: var(--neutral-400);
        fill: none;
        stroke-width: 2;
        pointer-events: none;
      }
      .input {
        width: 100%;
        padding: 11px 14px 11px 40px;
        font-family: inherit;
        font-size: 14px;
        color: var(--neutral-800);
        background: #fff;
        border: 1px solid var(--neutral-200);
        border-radius: var(--r-md);
        outline: none;
        transition: border-color .2s var(--ease-smooth), box-shadow .2s var(--ease-smooth);
      }
      .input:hover { border-color: var(--neutral-300); }
      .input:focus {
        border-color: var(--sage-400);
        box-shadow: 0 0 0 3px rgba(109,171,61,.15);
      }

      .btn-submit {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 13px 24px;
        background: var(--sage-600);
        color: #fff;
        border: none;
        border-radius: var(--r-md);
        font-size: 15px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        margin-top: 6px;
        transition: background .2s var(--ease-smooth), transform .2s var(--ease-smooth), box-shadow .2s var(--ease-smooth);
        box-shadow: 0 4px 14px rgba(61,112,32,.22);
      }
      .btn-submit:hover {
        background: var(--sage-700);
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(61,112,32,.32);
      }
      .btn-submit svg {
        width: 14px; height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }

      .form-foot {
        margin-top: 22px;
        padding-top: 20px;
        border-top: 1px dashed var(--neutral-200);
        text-align: center;
        font-size: 13px;
        color: var(--neutral-500);
      }
      .form-foot a {
        color: var(--sage-600);
        font-weight: 500;
        text-decoration: none;
      }
      .form-foot a:hover { text-decoration: underline; }

      .info-note {
        margin-top: 14px;
        padding: 12px 14px;
        background: var(--sakura-pale);
        border-left: 3px solid var(--sakura-mid);
        border-radius: 0 var(--r-md) var(--r-md) 0;
        font-size: 12px;
        color: #7a3050;
        line-height: 1.6;
      }
      .info-note strong { color: #5a1a38; }

      /* Responsive */
      @media (max-width: 800px) {
        body { flex-direction: column; }
        .brand {
          width: 100%;
          min-height: auto;
          padding: 32px 28px 28px;
        }
        .store-avatar { width: 60px; height: 60px; font-size: 26px; }
        .store-avatar-wrap { margin-bottom: 12px; }
        .store-name { font-size: 24px; margin-bottom: 4px; }
        .ornament { margin: 16px 0 12px; }
        .brand-hl { font-size: 16px; margin-bottom: 12px; }
        .features { display: none; }
        .brand-foot { display: none; }

        .form-side {
          width: 100%;
          padding: 38px 28px 56px;
        }
        .form-side::after { display: none; }
        .form-top-link { top: 14px; right: 16px; }
        .form-title { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <!-- LEFT (BRAND) -->
    <aside class="brand">
      <div class="bg-ring ring-1"></div>
      <div class="bg-ring ring-2"></div>
      <div class="bg-ring ring-3"></div>
      <div class="bg-ring ring-4"></div>
      <div class="bg-ring ring-5"></div>

      <svg class="deco-leaf dl-l1" viewBox="0 0 50 68" fill="none">
        <path d="M25 4 C13 9 7 22 9 36 C11 49 19 60 25 64 C31 60 39 49 41 36 C43 22 37 9 25 4Z" fill="white"/>
        <line x1="25" y1="4" x2="25" y2="64" stroke="white" stroke-width="1"/>
      </svg>
      <svg class="deco-leaf dl-l2" viewBox="0 0 62 82" fill="none">
        <path d="M31 5 C17 10 9 26 11 44 C13 58 22 72 31 78 C40 72 49 58 51 44 C53 26 45 10 31 5Z" fill="white"/>
        <line x1="31" y1="5" x2="31" y2="78" stroke="white" stroke-width="1.2"/>
      </svg>
      <svg class="deco-leaf dl-l3" viewBox="0 0 38 52" fill="none">
        <path d="M19 3 C10 7 6 17 8 28 C10 38 15 46 19 50 C23 46 28 38 30 28 C32 17 28 7 19 3Z" fill="white"/>
      </svg>

      <div class="brand-inner">
        <div class="store-avatar-wrap">
          <div class="store-avatar-ring"></div>
          <div class="store-avatar">芮</div>
        </div>
        <div class="store-name">芮選小舖</div>
        <div class="store-tag">RUEI · SELECT</div>

        <div class="ornament">
          <div class="ornament-center">
            <div class="orn-dot-sm"></div>
            <div class="orn-dot"></div>
            <div class="orn-dot-sm"></div>
          </div>
        </div>

        <p class="brand-hl">
          加入 <span class="accent">芮選小舖</span>，<br/>
          成為專屬會員。
        </p>

        <ul class="features">
          <li class="feature">
            <div class="feature-icon-wrap">
              <svg viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
            </div>
            <span class="feature-label">優先搶購新品</span>
          </li>
          <li class="feature">
            <div class="feature-icon-wrap">
              <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
            </div>
            <span class="feature-label">專屬下單管道</span>
          </li>
          <li class="feature">
            <div class="feature-icon-wrap">
              <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            </div>
            <span class="feature-label">查詢訂單狀態</span>
          </li>
        </ul>

        <p class="brand-foot">由 <a href="admin-login-v2c.html">芮選系統</a> 提供服務</p>
      </div>
    </aside>

    <!-- RIGHT (FORM) -->
    <main class="form-side">
      <a href="admin-login-v2c.html" class="form-top-link">
        芮選後台
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>

      <div class="form-box">
        <p class="form-eyebrow">會員申請</p>
        <h1 class="form-title">申請加入賣場</h1>
        <p class="form-body">
          填寫以下資訊，等待商家審核後，<br/>即可瀏覽商品與下單。
        </p>

        <a href="#" class="btn-line">
          <svg class="line-logo" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="10" fill="rgba(255,255,255,0.25)"/>
            <path d="M24 10C15.16 10 8 15.82 8 22.9C8 29.24 13.46 34.58 21.06 35.74C21.58 35.84 22.3 36.06 22.48 36.5C22.64 36.9 22.58 37.52 22.52 37.92L22.24 39.58C22.16 39.98 21.88 41.12 24 40.24C26.12 39.36 35.28 33.72 39.06 29.36C41.62 26.56 43 24 43 22.9C43 15.82 35.84 10 27 10H24Z" fill="white"/>
            <path d="M20 26.5V19.5H21.5V26.5H20ZM28 26.5L24.5 21.5V26.5H23V19.5H24.5L28 24.5V19.5H29.5V26.5H28ZM18.5 26.5H15V19.5H16.5V25H18.5V26.5ZM33 21H30.5V22.5H33V24H30.5V25H33V26.5H29V19.5H33V21Z" fill="#00B900"/>
          </svg>
          使用 LINE 快速登入
        </a>

        <div class="or-divider">
          <span>或填寫申請資料</span>
        </div>

        <form>
          <div class="form-row">
            <label class="form-label" for="name">姓名<span class="req">*</span></label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input id="name" class="input" type="text" placeholder="請輸入姓名" required />
            </div>
          </div>
          <div class="form-row">
            <label class="form-label" for="phone">手機號碼<span class="req">*</span></label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg>
              <input id="phone" class="input" type="tel" placeholder="例：0912-345-678" pattern="^0\d{2}-?\d{3}-?\d{3,4}$" required />
            </div>
          </div>
          <div class="form-row">
            <label class="form-label" for="lineId">LINE ID<span class="hint">@開頭或純數字</span></label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20"/></svg>
              <input id="lineId" class="input" type="text" placeholder="例：@your_line_id" />
            </div>
          </div>

          <button type="submit" class="btn-submit">
            <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
            送出申請
          </button>
        </form>

        <div class="info-note">
          <strong>審核時間：</strong>商家通常會在 24 小時內審核完成，通過後可立即開始使用。
        </div>

        <div class="form-foot">
          已是會員？<a href="#">直接使用 LINE 登入 →</a>
        </div>
      </div>
    </main>
  </body>
</html>
