<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>芮選 · 供應商管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }

      :root {
        --sage-50:#f2f8ec; --sage-100:#e0f0d0; --sage-200:#b8dca0;
        --sage-400:#6dab3d; --sage-500:#508a2c; --sage-600:#3d7020;
        --sage-700:#2c5218; --sage-800:#1c3610;
        --sakura-pale:#fff0f5; --sakura-100:#ffd8e8;
        --sakura-mid:#f5a8bf; --sakura:#e8749d;
        --neutral-0:#fff; --neutral-50:#f6fbf0; --neutral-100:#edf5e8;
        --neutral-200:#d8e8cc; --neutral-300:#b4c8a0; --neutral-400:#8a9a82;
        --neutral-500:#647258; --neutral-600:#4a5e42; --neutral-700:#2a3e20; --neutral-800:#192e10;
        --color-warning:#c4a828;
        --color-danger:#c4453d;
        --r-sm:6px; --r-md:12px; --r-lg:18px; --r-xl:24px; --r-full:999px;
        --sh-xs:0 1px 3px rgba(28,54,16,.07); --sh-sm:0 2px 8px rgba(28,54,16,.09);
        --sh-md:0 4px 16px rgba(28,54,16,.11); --sh-lg:0 8px 32px rgba(28,54,16,.14);
        --ease-smooth:cubic-bezier(.4,0,.2,1); --ease-bounce:cubic-bezier(.34,1.56,.64,1);
        --sidebar-w:220px; --sidebar-min:64px; --topbar-h:60px;
      }

      body {
        font-family: 'Noto Sans TC', sans-serif;
        background: var(--neutral-50);
        color: var(--neutral-800);
        min-height: 100vh;
        display: flex;
      }

      /* SIDEBAR */
      .sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--sage-600); background-image: radial-gradient(ellipse 60% 50% at 85% 12%, rgba(109,171,61,.32) 0%, transparent 65%), radial-gradient(ellipse 50% 60% at 10% 88%, rgba(28,54,16,.45) 0%, transparent 60%); color: #fff; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; transition: width .3s var(--ease-smooth), transform .3s var(--ease-smooth); overflow: hidden; }
      .sidebar.collapsed { width: var(--sidebar-min); }
      .sb-head { padding: 18px 16px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
      .sb-logo { flex-shrink: 0; width: 40px; height: 40px; display: grid; place-items: center; filter: drop-shadow(0 2px 6px rgba(0,0,0,.18)); }
      .sb-brand { font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: .12em; white-space: nowrap; transition: opacity .2s var(--ease-smooth); }
      .sb-brand-sub { font-size: 10px; color: rgba(255,255,255,.42); letter-spacing: .22em; white-space: nowrap; }
      .sidebar.collapsed .sb-brand,
      .sidebar.collapsed .sb-brand-sub,
      .sidebar.collapsed .nav-label,
      .sidebar.collapsed .nav-badge,
      .sidebar.collapsed .nav-tag,
      .sidebar.collapsed .sb-user-meta,
      .sidebar.collapsed .sb-nav-section { opacity: 0; pointer-events: none; }
      .sb-nav { list-style: none; padding: 14px 10px; flex: 1; overflow-y: auto; }
      .sb-nav-section { font-size: 10.5px; color: rgba(255,255,255,.32); letter-spacing: .22em; text-transform: uppercase; padding: 14px 12px 8px; white-space: nowrap; transition: opacity .2s var(--ease-smooth); }
      .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: rgba(255,255,255,.78); text-decoration: none; font-size: 14.5px; transition: background .15s var(--ease-smooth), color .15s var(--ease-smooth); white-space: nowrap; margin-bottom: 2px; cursor: pointer; }
      .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
      .nav-item.active { background: rgba(255,255,255,.13); color: #fff; box-shadow: inset 3px 0 0 var(--sakura-mid); }
      .nav-item.disabled { opacity: .35; cursor: not-allowed; }
      .nav-item.disabled:hover { background: transparent; }
      .nav-icon { flex-shrink: 0; width: 20px; height: 20px; display: grid; place-items: center; }
      .nav-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
      .nav-label { flex: 1; transition: opacity .2s var(--ease-smooth); }
      .nav-badge { background: var(--sakura); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: var(--r-full); line-height: 1.4; transition: opacity .2s var(--ease-smooth); }
      .nav-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,.08); color: rgba(255,255,255,.5); font-weight: 500; transition: opacity .2s var(--ease-smooth); }
      .sb-foot { padding: 12px 10px; border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 10px; }
      .sb-user { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
      .sb-avatar { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--sakura-mid), var(--sakura)); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; font-family: 'Zen Maru Gothic', sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
      .sb-user-meta { line-height: 1.3; overflow: hidden; transition: opacity .2s var(--ease-smooth); }
      .sb-user-name { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sb-user-role { font-size: 11px; color: rgba(255,255,255,.45); white-space: nowrap; }
      .sb-toggle { flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px; border: none; background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); display: grid; place-items: center; cursor: pointer; transition: background .15s var(--ease-smooth); }
      .sb-toggle:hover { background: rgba(255,255,255,.16); color: #fff; }
      .sb-toggle svg { width: 16px; height: 16px; transition: transform .3s var(--ease-smooth); }
      .sidebar.collapsed .sb-toggle svg { transform: rotate(180deg); }
      .sb-backdrop { display: none; position: fixed; inset: 0; background: rgba(28,54,16,.4); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 40; opacity: 0; transition: opacity .25s var(--ease-smooth); }
      .sb-backdrop.active { display: block; opacity: 1; }

      /* MAIN */
      .main { flex: 1; margin-left: var(--sidebar-w); transition: margin-left .3s var(--ease-smooth); min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
      .main.collapsed { margin-left: var(--sidebar-min); }
      .topbar { height: var(--topbar-h); background: rgba(255,255,255,.85); backdrop-filter: saturate(140%) blur(8px); -webkit-backdrop-filter: saturate(140%) blur(8px); border-bottom: 1px solid var(--neutral-200); display: flex; align-items: center; gap: 14px; padding: 0 24px; position: sticky; top: 0; z-index: 30; }
      .hamburger { display: none; background: none; border: 1px solid var(--neutral-200); border-radius: 8px; width: 36px; height: 36px; place-items: center; cursor: pointer; color: var(--sage-700); }
      .hamburger svg { width: 18px; height: 18px; }
      .crumb { font-size: 13px; color: var(--neutral-500); display: flex; align-items: center; gap: 6px; }
      .crumb a { color: var(--neutral-500); text-decoration: none; }
      .crumb strong { color: var(--neutral-800); font-weight: 500; }
      .crumb svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
      .topbar-spacer { flex: 1; }

      .content { flex: 1; padding: 28px 32px 56px; max-width: 1100px; width: 100%; }

      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }
      .page-title-block { min-width: 0; }
      .page-title {
        font-family: 'Zen Maru Gothic', sans-serif;
        font-size: 26px;
        font-weight: 700;
        color: var(--neutral-800);
        letter-spacing: .04em;
        margin-bottom: 4px;
      }
      .page-sub {
        font-size: 13.5px;
        color: var(--neutral-500);
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 18px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        border-radius: var(--r-md);
        cursor: pointer;
        border: 1px solid transparent;
        transition: background .15s var(--ease-smooth), color .15s var(--ease-smooth), transform .15s var(--ease-smooth), box-shadow .15s var(--ease-smooth);
        text-decoration: none;
      }
      .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
      .btn-primary { background: var(--sage-600); color: #fff; box-shadow: 0 2px 8px rgba(61,112,32,.22); }
      .btn-primary:hover { background: var(--sage-700); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(61,112,32,.3); }
      .btn-ghost { background: transparent; color: var(--neutral-600); border-color: var(--neutral-200); }
      .btn-ghost:hover { background: var(--neutral-100); color: var(--neutral-800); }

      /* Search row */
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 16px;
      }
      .search-wrap {
        position: relative;
        flex: 1;
        max-width: 360px;
      }
      .search-wrap svg {
        position: absolute;
        top: 50%;
        left: 12px;
        transform: translateY(-50%);
        width: 15px; height: 15px;
        stroke: var(--neutral-400);
        fill: none;
        stroke-width: 2;
        pointer-events: none;
      }
      .search-input {
        width: 100%;
        padding: 10px 14px 10px 38px;
        font-family: inherit;
        font-size: 14px;
        color: var(--neutral-800);
        background: #fff;
        border: 1px solid var(--neutral-200);
        border-radius: var(--r-md);
        outline: none;
        transition: border-color .2s var(--ease-smooth), box-shadow .2s var(--ease-smooth);
      }
      .search-input:focus {
        border-color: var(--sage-400);
        box-shadow: 0 0 0 3px rgba(109,171,61,.15);
      }

      /* List */
      .list-card {
        background: #fff;
        border: 1px solid var(--neutral-200);
        border-radius: var(--r-lg);
        overflow: hidden;
        box-shadow: var(--sh-xs);
      }
      .list-head {
        display: grid;
        grid-template-columns: 56px 1fr 110px 120px;
        gap: 16px;
        padding: 12px 22px;
        background: var(--neutral-100);
        border-bottom: 1px solid var(--neutral-200);
        font-size: 12px;
        color: var(--neutral-500);
        letter-spacing: .04em;
        font-weight: 500;
        text-transform: uppercase;
      }
      .list-head .col-actions { text-align: right; }

      .supplier-row {
        display: grid;
        grid-template-columns: 56px 1fr 110px 120px;
        gap: 16px;
        align-items: center;
        padding: 16px 22px;
        border-bottom: 1px solid var(--neutral-100);
        transition: background .15s var(--ease-smooth);
        cursor: pointer;
      }
      .supplier-row:last-child { border-bottom: none; }
      .supplier-row:hover { background: var(--neutral-50); }
      .supplier-avatar {
        width: 44px; height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-family: 'Zen Maru Gothic', sans-serif;
        font-size: 18px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .av-1 { background: var(--sage-100); color: var(--sage-700); }
      .av-2 { background: var(--sakura-pale); color: var(--sakura); }
      .av-3 { background: #fdf6dd; color: #8a7416; }
      .av-4 { background: #e8eef8; color: #4a6a99; }

      .supplier-info {
        min-width: 0;
      }
      .supplier-name {
        font-family: 'Zen Maru Gothic', sans-serif;
        font-size: 16px;
        font-weight: 500;
        color: var(--neutral-800);
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .supplier-note {
        font-size: 12.5px;
        color: var(--neutral-500);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .supplier-count {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 11px;
        background: var(--neutral-100);
        color: var(--neutral-600);
        font-size: 12px;
        border-radius: var(--r-full);
        font-weight: 500;
        white-space: nowrap;
        width: fit-content;
      }
      .supplier-count::before {
        content: '';
        width: 6px; height: 6px;
        background: var(--sage-400);
        border-radius: 50%;
      }
      .supplier-count.zero { color: var(--neutral-400); }
      .supplier-count.zero::before { background: var(--neutral-300); }

      .row-actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .icon-btn {
        width: 32px; height: 32px;
        border-radius: 8px;
        border: 1px solid var(--neutral-200);
        background: #fff;
        color: var(--neutral-500);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background .15s var(--ease-smooth), color .15s var(--ease-smooth), border-color .15s var(--ease-smooth);
      }
      .icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
      .icon-btn:hover { background: var(--sage-50); color: var(--sage-600); border-color: var(--sage-200); }
      .icon-btn.danger:hover { background: #fdf0ee; color: var(--color-danger); border-color: #f0c8c4; }

      /* Drawer */
      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(28,54,16,.25);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        z-index: 60;
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s var(--ease-smooth);
      }
      .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
      .drawer {
        position: fixed;
        top: 0; right: 0; bottom: 0;
        width: 400px;
        max-width: 100%;
        background: #fff;
        border-left: 1px solid var(--neutral-200);
        z-index: 70;
        transform: translateX(100%);
        transition: transform .35s var(--ease-smooth);
        display: flex;
        flex-direction: column;
        box-shadow: -8px 0 32px rgba(28,54,16,.18);
      }
      .drawer.open { transform: translateX(0); }
      .drawer-head {
        padding: 22px 24px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--neutral-100);
      }
      .drawer-title {
        font-family: 'Zen Maru Gothic', sans-serif;
        font-size: 18px;
        font-weight: 500;
        color: var(--neutral-800);
        letter-spacing: .04em;
      }
      .drawer-close {
        width: 32px; height: 32px;
        border-radius: 8px;
        border: none;
        background: var(--neutral-100);
        color: var(--neutral-500);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background .15s var(--ease-smooth);
      }
      .drawer-close:hover { background: var(--neutral-200); color: var(--neutral-700); }
      .drawer-close svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; }
      .drawer-body { padding: 22px 24px; flex: 1; overflow-y: auto; }
      .drawer-foot {
        padding: 16px 24px;
        border-top: 1px solid var(--neutral-100);
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        background: var(--neutral-50);
      }

      .form-row { margin-bottom: 18px; }
      .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--neutral-700); margin-bottom: 6px; letter-spacing: .03em; }
      .form-label .req { color: var(--sakura); margin-left: 2px; }
      .form-label .opt { color: var(--neutral-400); font-weight: 400; margin-left: 4px; font-size: 11.5px; }
      .input, .textarea { width: 100%; padding: 11px 14px; font-family: inherit; font-size: 14px; color: var(--neutral-800); background: #fff; border: 1px solid var(--neutral-200); border-radius: var(--r-md); outline: none; transition: border-color .2s var(--ease-smooth), box-shadow .2s var(--ease-smooth); }
      .input:hover, .textarea:hover { border-color: var(--neutral-300); }
      .input:focus, .textarea:focus { border-color: var(--sage-400); box-shadow: 0 0 0 3px rgba(109,171,61,.15); }
      .textarea { resize: vertical; min-height: 88px; line-height: 1.6; }
      .form-help { margin-top: 6px; font-size: 11.5px; color: var(--neutral-400); line-height: 1.5; }

      /* Empty state (alt for filtering) */
      .empty-state { padding: 64px 24px; text-align: center; color: var(--neutral-500); }
      .empty-icon { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; background: var(--neutral-100); display: grid; place-items: center; color: var(--neutral-400); }
      .empty-icon svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.5; }
      .empty-title { font-family: 'Zen Maru Gothic', sans-serif; font-size: 15px; color: var(--neutral-700); margin-bottom: 6px; font-weight: 500; }
      .empty-desc { font-size: 12.5px; color: var(--neutral-400); line-height: 1.7; max-width: 320px; margin: 0 auto; }

      @media (max-width: 767px) {
        .sidebar { transform: translateX(-100%); width: var(--sidebar-w); }
        .sidebar.open { transform: translateX(0); }
        .sidebar.collapsed { width: var(--sidebar-w); }
        .main { margin-left: 0 !important; }
        .hamburger { display: grid; }
        .content { padding: 18px 16px 48px; }
        .topbar { padding: 0 16px; }
        .list-head { display: none; }
        .supplier-row {
          grid-template-columns: 48px 1fr;
          gap: 14px;
          padding: 14px 16px;
          row-gap: 8px;
        }
        .supplier-info { grid-column: 2; }
        .supplier-count { grid-column: 2; margin-top: 4px; }
        .row-actions { grid-column: 1 / -1; justify-content: flex-end; padding-top: 4px; border-top: 1px dashed var(--neutral-100); }

        /* Drawer becomes bottom sheet */
        .drawer {
          top: auto;
          left: 0;
          right: 0;
          bottom: 0;
          width: 100%;
          height: 70vh;
          border-left: none;
          border-top: 1px solid var(--neutral-200);
          border-radius: 20px 20px 0 0;
          transform: translateY(100%);
        }
        .drawer.open { transform: translateY(0); }
        .drawer::before {
          content: '';
          position: absolute;
          top: 8px; left: 50%;
          transform: translateX(-50%);
          width: 38px; height: 4px;
          background: var(--neutral-200);
          border-radius: 2px;
        }
        .drawer-head { padding-top: 22px; }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <div class="sb-logo">
          <svg width="40" height="40" viewBox="0 0 120 120" fill="none">
            <circle cx="60" cy="60" r="57" stroke="rgba(255,255,255,.65)" stroke-width="1.8"/>
            <circle cx="60" cy="60" r="57" fill="rgba(255,255,255,.08)"/>
            <g transform="translate(60,60)">
              <g transform="rotate(-45) translate(0,-6)"><path d="M 0 2 C -1.5 -1 -8 -1 -8 -8 C -8 -14 -2.5 -17 0 -13 C 2.5 -17 8 -14 8 -8 C 8 -1 1.5 -1 0 2 Z" fill="none" stroke="rgba(255,255,255,.88)" stroke-width="1.5" stroke-linejoin="round"/></g>
              <g transform="rotate(45) translate(0,-6)"><path d="M 0 2 C -1.5 -1 -8 -1 -8 -8 C -8 -14 -2.5 -17 0 -13 C 2.5 -17 8 -14 8 -8 C 8 -1 1.5 -1 0 2 Z" fill="none" stroke="rgba(255,255,255,.88)" stroke-width="1.5" stroke-linejoin="round"/></g>
              <g transform="rotate(135) translate(0,-6)"><path d="M 0 2 C -1.5 -1 -8 -1 -8 -8 C -8 -14 -2.5 -17 0 -13 C 2.5 -17 8 -14 8 -8 C 8 -1 1.5 -1 0 2 Z" fill="none" stroke="rgba(255,255,255,.88)" stroke-width="1.5" stroke-linejoin="round"/></g>
              <g transform="rotate(235) translate(0,-6)"><path d="M 0 2 C -1.5 -1 -8 -1 -8 -8 C -8 -14 -2.5 -17 0 -13 C 2.5 -17 8 -14 8 -8 C 8 -1 1.5 -1 0 2 Z" fill="none" stroke="rgba(255,255,255,.88)" stroke-width="1.5" stroke-linejoin="round"/></g>
              <circle r="2.2" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".9"/>
              <circle r="1.1" fill="rgba(232,116,157,.82)"/>
            </g>
          </svg>
        </div>
        <div>
          <div class="sb-brand">芮選</div>
          <div class="sb-brand-sub">RUEI SELECT</div>
        </div>
      </div>

      <ul class="sb-nav">
        <li class="sb-nav-section">主功能</li>
        <li><a href="admin-dashboard.html" class="nav-item">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>
          <span class="nav-label">總覽</span>
        </a></li>

    <!-- Drawer -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-labelledby="drawerTitle" aria-hidden="true">
      <div class="drawer-head">
        <h3 class="drawer-title" id="drawerTitle">新增供應商</h3>
        <button class="drawer-close" id="drawerClose" aria-label="關閉">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="drawer-body">
        <form>
          <div class="form-row">
            <label class="form-label" for="supName">供應商名稱<span class="req">*</span></label>
            <input id="supName" class="input" type="text" placeholder="例：日本 LALA 貿易" required />
            <div class="form-help">用於後續上架商品時辨識來源，建議使用易記的簡稱。</div>
          </div>
          <div class="form-row">
            <label class="form-label" for="supNote">備註<span class="opt">（選填）</span></label>
            <textarea id="supNote" class="textarea" placeholder="例：聯絡窗口、批發條件、出貨週期…"></textarea>
            <div class="form-help">這些資訊只會顯示在後台，顧客看不到。</div>
          </div>
        </form>
      </div>
      <div class="drawer-foot">
        <button class="btn btn-ghost" type="button" id="drawerCancel">取消</button>
        <button class="btn btn-primary" type="button">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          儲存
        </button>
      </div>
    </aside>

    <script>
      const sidebar = document.getElementById('sidebar');
      const main = document.getElementById('main');
      const sbToggle = document.getElementById('sbToggle');
      const hamburger = document.getElementById('hamburger');
      const sbBackdrop = document.getElementById('sbBackdrop');

      sbToggle.addEventListener('click', () => {
        if (window.innerWidth < 768) {
          sidebar.classList.remove('open');
          sbBackdrop.classList.remove('active');
        } else {
          sidebar.classList.toggle('collapsed');
          main.classList.toggle('collapsed');
        }
      });
      hamburger.addEventListener('click', () => {
        sidebar.classList.add('open');
        sbBackdrop.classList.add('active');
      });
      sbBackdrop.addEventListener('click', () => {
        sidebar.classList.remove('open');
        sbBackdrop.classList.remove('active');
      });

      // Drawer
      const drawer = document.getElementById('drawer');
      const drawerBackdrop = document.getElementById('drawerBackdrop');
      const drawerClose = document.getElementById('drawerClose');
      const drawerCancel = document.getElementById('drawerCancel');
      const addBtn = document.getElementById('addBtn');
      const drawerTitle = document.getElementById('drawerTitle');
      const supName = document.getElementById('supName');
      const supNote = document.getElementById('supNote');

      const openDrawer = (mode, data) => {
        drawerTitle.textContent = mode === 'edit' ? '編輯供應商' : '新增供應商';
        if (mode === 'edit' && data) {
          supName.value = data.name || '';
          supNote.value = data.note || '';
        } else {
          supName.value = '';
          supNote.value = '';
        }
        drawer.classList.add('open');
        drawerBackdrop.classList.add('open');
        drawer.setAttribute('aria-hidden', 'false');
      };
      const closeDrawer = () => {
        drawer.classList.remove('open');
        drawerBackdrop.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
      };

      addBtn.addEventListener('click', () => openDrawer('new'));
      drawerClose.addEventListener('click', closeDrawer);
      drawerCancel.addEventListener('click', closeDrawer);
      drawerBackdrop.addEventListener('click', closeDrawer);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDrawer();
      });

      document.querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const name = btn.getAttribute('data-edit');
          const note = btn.closest('.supplier-row').querySelector('.supplier-note').textContent;
          openDrawer('edit', { name, note });
        });
      });
    </script>
  </body>
