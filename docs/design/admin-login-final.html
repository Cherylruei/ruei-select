<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>芮選 · 商家後台登入</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        font-family: 'Noto Sans TC', sans-serif;
      }
      body {
        display: flex;
        min-height: 100vh;
      }

      .brand-side {
        width: 52%;
        background: linear-gradient(
          168deg,
          #1e3d1c 0%,
          #2a5428 18%,
          #3a7035 40%,
          #3a8838 65%,
          #4a9845 85%,
          #3a8838 100%
        );
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 64px 56px;
      }
      .brand-side::before {
        content: '';
        position: absolute;
        top: -20%;
        left: -20%;
        width: 70%;
        height: 70%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.06) 0%,
          transparent 65%
        );
        pointer-events: none;
      }
      .bg-trees {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .brand-inner {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
      .logo-wrap {
        margin-bottom: 32px;
        animation: logoReveal 1s cubic-bezier(0.34, 1.1, 0.64, 1) both;
      }
      @keyframes logoReveal {
        from {
          opacity: 0;
          transform: scale(0.88) translateY(12px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .brand-slogan {
        font-size: 13px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.68);
        line-height: 2.1;
        letter-spacing: 0.08em;
        text-align: center;
        margin-bottom: 40px;
      }
      .brand-features {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
        max-width: 300px;
      }
      .brand-feat {
        display: flex;
        align-items: center;
        gap: 14px;
        animation: featReveal 0.6s cubic-bezier(0.34, 1.1, 0.64, 1) both;
      }
      .brand-feat:nth-child(1) {
        animation-delay: 0.15s;
      }
      .brand-feat:nth-child(2) {
        animation-delay: 0.25s;
      }
      .brand-feat:nth-child(3) {
        animation-delay: 0.35s;
      }
      .brand-feat:nth-child(4) {
        animation-delay: 0.45s;
      }
      @keyframes featReveal {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      .feat-icon-wrap {
        width: 38px;
        height: 38px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        flex-shrink: 0;
      }
      .feat-text {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.8);
        font-weight: 400;
      }

      .login-side {
        width: 48%;
        background: #fafaf8;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 52px;
        position: relative;
      }
      .login-side::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(
            circle at 85% 15%,
            rgba(181, 220, 172, 0.08) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 15% 85%,
            rgba(181, 220, 172, 0.06) 0%,
            transparent 35%
          );
        pointer-events: none;
      }
      .login-inner {
        width: 100%;
        max-width: 340px;
        position: relative;
        z-index: 1;
        animation: formReveal 0.7s cubic-bezier(0.34, 1.1, 0.64, 1) 0.1s both;
      }
      @keyframes formReveal {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .admin-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: #f2f8f0;
        border: 1px solid #dcefd8;
        border-radius: 999px;
        padding: 4px 14px;
        font-size: 11px;
        color: #55a44a;
        font-weight: 500;
        letter-spacing: 0.08em;
        margin-bottom: 28px;
      }
      .badge-dot {
        width: 5px;
        height: 5px;
        background: #55a44a;
        border-radius: 50%;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(0.7);
        }
      }
      .login-title {
        font-family: 'Zen Maru Gothic', sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: #1e2218;
        margin-bottom: 8px;
      }
      .login-sub {
        font-size: 14px;
        color: #8c9880;
        font-weight: 300;
        margin-bottom: 44px;
        line-height: 1.8;
      }
      .btn-line {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 15px 24px;
        background: #06c755;
        color: white;
        border: none;
        border-radius: 14px;
        font-family: 'Zen Maru Gothic', sans-serif;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.05em;
        transition: all 220ms cubic-bezier(0.34, 1.4, 0.64, 1);
        box-shadow:
          0 1px 2px rgba(6, 199, 85, 0.15),
          0 4px 16px rgba(6, 199, 85, 0.3);
        position: relative;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .btn-line::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.12) 0%,
          transparent 50%
        );
        pointer-events: none;
      }
      .btn-line:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow:
          0 2px 4px rgba(6, 199, 85, 0.15),
          0 8px 24px rgba(6, 199, 85, 0.4);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 24px 0;
        color: #d8ddd0;
        font-size: 11px;
        letter-spacing: 0.06em;
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #edf0e8;
      }
      .login-note {
        font-size: 11px;
        color: #b4bcaa;
        text-align: center;
        line-height: 2;
      }
      .login-note a {
        color: #82c278;
        text-decoration: none;
      }
      .version-tag {
        position: absolute;
        bottom: 24px;
        right: 28px;
        font-size: 10px;
        color: #d8ddd0;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
